[package]
name = "fretboard"
version = "0.1.0"
edition = "2024"
# The bin target is named distinctly from the lib so the wasm/web build can
# disambiguate. On wasm `cargo` emits BOTH this bin's wasm and the lib's cdylib
# wasm (the cdylib exists for Android NativeActivity); trunk selects an artifact
# by target NAME, so the bin and lib must not both be named `fretboard`.
default-run = "fretboard-app"

[[bin]]
name = "fretboard-app"
path = "src/main.rs"

# rlib: consumed by the desktop/wasm `fretboard-app` bin (src/main.rs).
# cdylib: NativeActivity dlopen's `libfretboard.so` on Android — without it
# cargo-apk silently packages a stale leftover .so and your changes never ship.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
egui_tiles = "*"
itertools = { version = "*" }
serde_json.workspace = true
serde.workspace = true
nom = { version = "*" }
# `Instant` that works on every target: re-exports std on native/Android, and
# uses `performance.now()` on wasm — std::time::Instant panics ("time not
# implemented on this platform") on wasm32-unknown-unknown.
web-time = "*"

# DSP core (FFT spectrum + resonator bank) — shared by the native and wasm audio
# engines (`audio::dsp`/`audio::core`), so these are all-target deps. cpal/ringbuf
# stay native-only: the browser captures via Web Audio, not cpal.
rustfft = "*"
# Real-input FFT for the RT-SWIPE frontend (`audio::dsp::rtswipe`): half the
# butterflies of a full complex FFT on a real signal, same output bins. Wraps the
# same `rustfft` (^6, unifies with the pin above → one `num_complex`, one `Complex32`).
realfft = "*"
# Fork (PR jhartquist/resonators#6): adds OnePoleBank — the phasor-free, self-
# stabilizing core (~1.4–1.7× faster) plus an f64 de-rotation fix that keeps
# phase()/complex() accurate over a long session. We drive the snail's Δφ
# reassignment off phase(), so the f64 fix matters here. Pin to a rev so the
# build is reproducible; bump to the crates.io release once the PR lands.
resonators = { git = "https://github.com/enomado/resonators.git", branch = "onepole-bank" }

eframe.workspace = true

[dev-dependencies]
# Direct handle on the same RON used by eframe storage, for the persistence round-trip test.
ron = "*"
# Renders widgets offscreen through the real egui/epaint/wgpu stack, so the pill's
# text centring can be asserted on actual pixels instead of on font metrics.
egui_kittest = { version = "0.35", features = ["wgpu"] }
image = "0.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "*"
ringbuf = "*"
# WAV, both directions, and every end is about the same corpus:
#   - `audio::native::imp::recorder` WRITES takes straight off the capture ring,
#     which is what makes a take *be* the signal the detector saw rather than a
#     recording that resembles it;
#   - `audio::native::imp::replay` READS one back INTO the engine, so the line the
#     detector draws for a take can be looked at after the fact;
#   - `dsp::swipe`'s real-audio probes read them too, to measure the octave
#     decision on a real bowed G string instead of a synthetic column.
# The app used to write audio files and never load one. Replay ended that, by a
# decision taken 2026-07-15 with the cost understood: the alternative was that a
# take's line existed only while it was being played and could never be marked up
# (`memory/kickstart_recording_and_annotation.md`). What the invariant protected
# still holds — the detector's decisions are still never written down; replay
# recomputes them with today's engine, which is what the invariant was for.
hound = "3"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { workspace = true, features = ["accesskit", "wayland", "wgpu", "x11"] }
subsecond.workspace = true
dioxus-cli-config.workspace = true
tungstenite.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "*", features = ["native-activity"] }
eframe = { workspace = true, features = ["android-native-activity", "wgpu"] }
# Runtime RECORD_AUDIO request (see src/android_perm.rs). jni/ndk-context are
# already in the tree transitively via cpal/android-activity.
jni = "*"
ndk-context = "*"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["glow", "persistence"] }
wasm-bindgen = "*"
wasm-bindgen-futures = "*"
js-sys = "*"
# Wire format for main-thread ↔ DSP-worker messages (samples / settings out,
# readings back). Compact binary, much cheaper than JSON for the f32 spectra.
# Compact binary serde format for the wire protocol. postcard keeps payloads
# ~as small as bincode (matters: full 52-row waterfalls ship worker→main every
# audio callback and decode on the UI thread), but is a tiny pure-Rust no_std
# crate. `default-features = false` drops the heapless default; `alloc` gives us
# `to_allocvec`.
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Web Audio capture (mic via getUserMedia, system via getDisplayMedia) + the
# audio graph (MediaStreamSource → ScriptProcessor) that ships samples to the
# DSP web worker.
web-sys = { version = "*", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "MediaDevices",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "DisplayMediaStreamConstraints",
    "AudioContext",
    "BaseAudioContext",
    "AudioContextState",
    "MediaStreamAudioSourceNode",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "AudioNode",
    "AudioDestinationNode",
    "Event",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
] }

[package.metadata.android]
package = "com.fretboard.snail"
build_targets = ["aarch64-linux-android"]
resources = "android/res"
strip = "strip"

[package.metadata.android.application]
label = "Resonator Snail"
theme = "@style/AppTheme"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

# Release-сборка (`cargo apk build --lib --release`) обязана быть подписана.
# Для локальных perf-/dev-прогонов подписываем стандартным debug-keystore
# (`~/.android/debug.keystore`, пароль "android" — публичный, не секрет). Это даёт
# оптимизированный (release-profile) APK без заведения отдельного релизного ключа;
# для публикации в стор нужен настоящий ключ — заменить path/пароль здесь.
[package.metadata.android.signing.release]
# ⚠ cargo-apk НЕ раскрывает `~` — путь с тильдой он склеивает с manifest dir
# (`<repo>/~/.android/...`) и apksigner падает на FileNotFound. Только абсолютный.
path = "/home/sc/.android/debug.keystore"
keystore_password = "android"

# Снейл питается с микрофона → без RECORD_AUDIO банк резонаторов молчит.
# Это dangerous-permission: на minSdk 26 / target 34 манифестной декларации мало,
# нужен ещё runtime-запрос (см. android_main), иначе AAudio отдаёт тишину.
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden"
exported = true
orientation = "portrait"

[profile]

# Release builds the wasm/web bundle: the audio DSP runs on the main thread
# there, so squeeze codegen. fat LTO + a single codegen unit let the optimizer
# inline across the FFT/resonator hot path; trunk's wasm-opt (data-wasm-opt=4)
# then does a second speed pass on the wasm.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"


[workspace.dependencies]
egui = "*"
eframe = { version = "*", default-features = false, features = ["default_fonts", "persistence"] }
subsecond = "*"
dioxus-cli-config = "*"
tungstenite = { version = "*", features = ["native-tls"] }
serde_json = "*"
serde = { version = "*", features = ["derive"] }
